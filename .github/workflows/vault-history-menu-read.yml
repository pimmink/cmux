name: Vault History menu read (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  history-menu-read:
    if: github.repository == 'pimmink/cmux'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download the reviewed tagged application artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vault-art"
          gh run download 43029132858 --repo pimmink/cmux \
            --name vault-native-cas-43029132858-1 --dir "$RUNNER_TEMP/vault-art"
          cd "$RUNNER_TEMP/vault-art"
          unzip -q cmux-vault-cas.zip -d unpacked
          APP="$(find unpacked -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          echo "APP_PATH=$RUNNER_TEMP/vault-art/$APP" >> "$GITHUB_ENV"

      - name: Launch the tagged app and read the History submenu (no activation)
        run: |
          set -euo pipefail
          open -n "$APP_PATH"
          PID=""
          for _ in $(seq 1 60); do
            PID="$(pgrep -f "$APP_PATH/Contents/MacOS/" | head -1 || true)"
            [ -n "$PID" ] && break
            sleep 2
          done
          test -n "$PID"
          echo "app_pid=$PID"
          NAMES="$(osascript -e "
            tell application \"System Events\"
              set p to first process whose unix id is $PID
              set hm to menu bar item \"History\" of menu bar 1 of p
              click hm
              delay 1
              set out to name of every menu item of menu 1 of hm
              key code 53
              return out
            end tell")"
          echo "history_items_begin"
          printf '%s\n' "$NAMES"
          echo "history_items_end"
          test -n "$NAMES"
          kill "$PID" || true
