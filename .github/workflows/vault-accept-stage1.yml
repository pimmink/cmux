name: Vault acceptance stage 1 (app, workspace, surface, socket)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage1:
    if: github.repository == 'pimmink/cmux'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Download the reviewed tagged app and verify its binary SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/vault-art"; mkdir -p "$D"
          gh run download 43029132858 --repo pimmink/cmux \
            --name vault-native-cas-43029132858-1 --dir "$D"
          cd "$D"
          unzip -q cmux-vault-cas.zip -d unpacked
          APP="$(find unpacked -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          BIN_SHA="$(shasum -a 256 "$APP/Contents/MacOS/cmux DEV" | cut -d' ' -f1)"
          echo "binary_sha256=$BIN_SHA"
          test "$BIN_SHA" = "6b8500101ed0c8668c0625f7be2e152c6bf5311219c964b2434d9a5eb9dc5b52"
          echo "APP_PATH=$D/$APP" >> "$GITHUB_ENV"

      - name: Write the reviewed parser inline and pin it by sha256
        env:
          PARSER_SHA256: 7a38fe1fdc753f2b0165624f845a7a929cc184d897c581a32c28bf198a148155
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/parse_cmux_ref.py" <<'PARSER_EOF'
          #!/usr/bin/env python3
          """Parse one cmux creation result from `--json` output.

          Contract (CLI/cmux.swift printV2Payload): with --json the CLI prints the
          v2 payload as a JSON object. The reference fields are `workspace_ref`,
          `surface_ref`, `window_ref` and `group_ref` (short refs such as
          `workspace:1000000001`; `group_ref` may be null). A non-zero exit
          or non-JSON output is a failure, never a pass.

          Usage: parse_cmux_ref.py <field> <stdout-file> <exit-code>
          Exit: 0 ok (prints the reference), 3 CLI failed, 4 not JSON, 5 field missing or empty.
          """
          import json
          import re
          import sys

          REF = re.compile(r"^(workspace|surface):\d+$")


          def parse(field: str, text: str, exit_code: int) -> tuple[int, str]:
              if exit_code != 0:
                  return 3, f"cli exit {exit_code}"
              try:
                  payload = json.loads(text)
              except (ValueError, TypeError):
                  return 4, "output is not JSON"
              if not isinstance(payload, dict):
                  return 4, "payload is not an object"
              value = payload.get(field)
              if not isinstance(value, str) or not value.strip():
                  return 5, f"field {field} missing or empty"
              value = value.strip()
              if not REF.match(value) or not value.startswith(field.split("_")[0] + ":"):
                  return 5, f"field {field} is not a {field.split('_')[0]} reference: {value!r}"
              return 0, value


          def main() -> int:
              if len(sys.argv) != 4:
                  print("usage: parse_cmux_ref.py <field> <stdout-file> <exit-code>", file=sys.stderr)
                  return 2
              field, path, code = sys.argv[1], sys.argv[2], int(sys.argv[3])
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()
              rc, msg = parse(field, text, code)
              if rc == 0:
                  print(msg)
              else:
                  print(f"parse_error: {msg}", file=sys.stderr)
              return rc


          if __name__ == "__main__":
              sys.exit(main())
          PARSER_EOF
          test "$(shasum -a 256 "$RUNNER_TEMP/parse_cmux_ref.py" | cut -d' ' -f1)" = "$PARSER_SHA256" || { echo "parser_sha_mismatch"; exit 1; }
          echo "parser_sha256=$PARSER_SHA256"

      - name: Write the surface-check script inline and pin it by sha256
        env:
          SURFACE_SCRIPT_SHA256: c943ae386f6831415aef4d87ab5347e0ed9d982230444fd4f0ab9372a37773da
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/surface_in_workspace.py" <<'SURFACE_EOF'
          """Check that a surface reference belongs to a workspace listing.

          Input: the surface ref, and the `list-panels --json` stdout file.
          Accepts a bare list or an object with a "surfaces" list. Each item must
          carry `surface_ref` (or `ref`). Exit 0 only if the ref is present.
          Exit 2 usage, 3 unreadable JSON, 5 ref absent.
          """
          import json
          import sys


          def surface_refs(payload):
              items = payload if isinstance(payload, list) else payload.get("surfaces", [])
              return [i.get("surface_ref") or i.get("ref") for i in items if isinstance(i, dict)]


          def main(argv):
              if len(argv) != 3:
                  return 2
              ref, path = argv[1], argv[2]
              try:
                  with open(path, encoding="utf-8") as fh:
                      payload = json.load(fh)
              except (OSError, ValueError):
                  return 3
              if not isinstance(payload, (list, dict)):
                  return 3
              return 0 if ref in surface_refs(payload) else 5


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          SURFACE_EOF
          test "$(shasum -a 256 "$RUNNER_TEMP/surface_in_workspace.py" | cut -d' ' -f1)" = "$SURFACE_SCRIPT_SHA256" || { echo "surface_script_sha_mismatch"; exit 1; }

      - name: Isolated scope (disposable cwd and GSD_HOME)
        run: |
          set -euo pipefail
          SCOPE="$RUNNER_TEMP/vault-scope"
          mkdir -p "$SCOPE/cwd" "$SCOPE/gsd-home"
          echo "SCOPE=$SCOPE" >> "$GITHUB_ENV"

      - name: Launch the tagged app isolated and wait for its socket
        run: |
          set -uo pipefail
          HOME="$SCOPE/gsd-home" open -n "$APP_PATH"
          PID=""
          for _ in $(seq 1 60); do
            PID="$(pgrep -f "$APP_PATH/Contents/MacOS/" | head -1 || true)"
            [ -n "$PID" ] && break; sleep 2
          done
          test -n "$PID" || { echo "stage=launch result=FAIL no_pid"; exit 1; }
          echo "app_pid=$PID" 
          echo "APP_PID=$PID" >> "$GITHUB_ENV"
          echo "stage=launch result=PASS pid=$PID"

      - name: Create one workspace and one surface through the socket (no clicks)
        run: |
          set -uo pipefail
          CLI="$APP_PATH/Contents/Resources/bin/cmux"
          test -x "$CLI" || { echo "stage=cli result=FAIL cli_missing path=$CLI"; exit 1; }
          echo "stage=cli result=PASS path=$CLI"
          # Wait for the app to open its socket (bounded). The process existing is not enough.
          SOCK=""
          for _ in $(seq 1 45); do
            for cand in "/tmp/cmux-debug-vault3014-cas-43029132858.sock" "$HOME/.local/state/cmux/cmux.sock" "/tmp/cmux.sock"; do
              [ -S "$cand" ] && SOCK="$cand" && break
            done
            [ -n "$SOCK" ] && break
            sleep 2
          done
          if [ -z "$SOCK" ]; then
            echo "stage=socket result=FAIL no_socket_after_90s"
            find /tmp -maxdepth 1 -name '*.sock' -exec ls -la {} + 2>/dev/null || true
            exit 1
          fi
          echo "stage=socket result=PASS path=$SOCK"
          # Read-only socket diagnostics: what does the live app actually listen on?
          echo "diag_app_pid=${APP_PID:-unset}"
          if [ -n "${APP_PID:-}" ]; then
            ps -o pid,etime,command -p "$APP_PID" | sed 's/^/diag_ps: /' || true
            lsof -nP -p "$APP_PID" 2>/dev/null | grep -i 'sock\|unix' | sed 's/^/diag_lsof: /' | head -20 || echo "diag_lsof: none"
          fi
          find /tmp -maxdepth 1 -name '*.sock' -exec ls -la {} + 2>/dev/null | sed 's/^/diag_ls: /' || echo "diag_ls: none"
          # Contract: `--json` prints the v2 payload as JSON (CLI/cmux.swift printV2Payload).
          # The reference is read from the JSON field, never from text. Real exit code kept.
          set +e
          WS_OUT="$("$CLI" --socket "$SOCK" --json workspace create 2>"$RUNNER_TEMP/ws.stderr")"; WS_EXIT=$?
          set -e
          echo "workspace_create_exit=$WS_EXIT"
          echo "--- stdout (workspace create --json) ---"; echo "$WS_OUT"
          echo "--- stderr (workspace create) ---"; cat "$RUNNER_TEMP/ws.stderr" || true
          printf '%s' "$WS_OUT" > "$RUNNER_TEMP/ws.stdout"
          set +e
          WS_REF="$(python3 "$RUNNER_TEMP/parse_cmux_ref.py" workspace_ref "$RUNNER_TEMP/ws.stdout" "$WS_EXIT")"; PARSE_RC=$?
          set -e
          test "$WS_EXIT" = "0" || { echo "stage=workspace result=FAIL cli_exit=$WS_EXIT"; exit 1; }
          test "$PARSE_RC" = "0" || { echo "stage=workspace result=FAIL parse_rc=$PARSE_RC"; exit 1; }
          echo "workspace_ref=$WS_REF"
          echo "stage=workspace result=PASS ref=$WS_REF"

          # Surface: the workspace create payload carries surface_ref. Read it from the same JSON,
          # then verify read-only (list-panels --json, no create) that it belongs to THIS workspace.
          SURF_REF="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("surface_ref",""))' "$RUNNER_TEMP/ws.stdout")" || SURF_REF=""
          test -n "$SURF_REF" || { echo "stage=surface result=FAIL no_surface_ref_in_workspace_payload"; exit 1; }
          echo "surface_ref=$SURF_REF"
          set +e
          LIST_OUT="$("$CLI" --socket "$SOCK" --json list-panels --workspace "$WS_REF" 2>"$RUNNER_TEMP/list.stderr")"; LIST_EXIT=$?
          set -e
          echo "list_panels_exit=$LIST_EXIT"
          echo "--- stdout (list-panels --json) ---"; echo "$LIST_OUT"
          echo "--- stderr (list-panels) ---"; cat "$RUNNER_TEMP/list.stderr" || true
          printf '%s' "$LIST_OUT" > "$RUNNER_TEMP/list.stdout"
          test "$LIST_EXIT" = "0" || { echo "stage=surface result=FAIL list_exit=$LIST_EXIT"; exit 1; }
          python3 "$RUNNER_TEMP/surface_in_workspace.py" "$SURF_REF" "$RUNNER_TEMP/list.stdout" \
            || { echo "stage=surface result=FAIL surface_not_in_workspace ref=$SURF_REF"; exit 1; }
          echo "stage=surface result=PASS ref=$SURF_REF workspace=$WS_REF"

      - name: Upload stage-1 evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-accept-stage1
          path: ${{ runner.temp }}/vault-scope
          if-no-files-found: warn
